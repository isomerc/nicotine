name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: cargo test --verbose

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy -- -D warnings

  windows-check:
    name: Windows compile check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # cargo-xwin invokes `clang-cl` (provided by the `clang` package; it
      # symlinks to `clang` and switches to MSVC mode based on argv[0]).
      # `llvm` provides `llvm-rc-NN` which build.rs uses to compile the
      # .exe icon resource.
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang llvm

      # The xwin SDK download is several hundred MB — cache it across
      # CI runs so we only pay the cost on the first run after a key bust.
      - name: Cache xwin SDK
        uses: actions/cache@v4
        with:
          path: ~/.cache/cargo-xwin
          key: cargo-xwin-ubuntu-latest-v1

      - name: Install cargo-xwin
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-xwin

      - name: Clippy on Windows target
        run: cargo xwin clippy --release --target x86_64-pc-windows-msvc -- -D warnings

  integration-linux:
    name: Integration tests (Linux X11)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Xvfb gives us a headless X server; openbox is a tiny EWMH-
      # compliant WM that publishes _NET_CLIENT_LIST and honors
      # _NET_ACTIVE_WINDOW ClientMessages — enough for the
      # enumeration + cycle paths to behave like a real desktop.
      # wmctrl is a runtime dep of nicotine's KWinManager (called
      # via shell), and the GL stack (libgl) is needed because
      # eframe links against it even for headless test builds.
      - name: Install X11 + WM + GL deps
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb openbox wmctrl \
            libxkbcommon-x11-0 libgl1 libwayland-client0

      # Phase 3 input-simulation tests create uinput virtual
      # keyboards / mice through /dev/uinput. Two pieces of access
      # are needed on the runner:
      # (1) /dev/uinput itself — root-only by default; chmod 666
      #     lets the test ioctl into it.
      # (2) The /dev/input/event* nodes the kernel creates for each
      #     virtual device — udev sets them to `root:input 0660` by
      #     default, and the ubuntu-latest `runner` user isn't in
      #     `input`. A udev rule loosens MODE so the daemon
      #     subprocess (also running as `runner`) can read events
      #     emitted through the virtual devices.
      - name: Enable uinput + permissive event-device perms
        run: |
          sudo modprobe uinput
          sudo chmod 666 /dev/uinput
          echo 'KERNEL=="event*", MODE="0666"' | \
            sudo tee /etc/udev/rules.d/99-nicotine-test.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger

      - name: Run integration tests under Xvfb
        run: |
          set -e
          Xvfb :99 -screen 0 1280x800x24 &
          XVFB_PID=$!
          export DISPLAY=:99
          # Give Xvfb a beat to bind before the WM connects.
          sleep 1
          openbox &
          OPENBOX_PID=$!
          sleep 1
          ./run-tests.sh integration
          STATUS=$?
          # Best-effort cleanup so the runner doesn't hang on
          # background processes after the test step.
          kill $OPENBOX_PID $XVFB_PID 2>/dev/null || true
          exit $STATUS

  integration-windows:
    name: Integration tests (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # GitHub's windows-latest runners have a graphical session
      # available by default; no Xvfb-equivalent setup needed. The
      # fake-EVE harness creates real top-level windows via
      # CreateWindowExW; the test daemon talks to them over the same
      # Win32 enumeration path Nicotine itself uses.
      - name: Run integration tests
        shell: bash
        run: cargo test --test fake_eve -- --ignored --test-threads=1 --nocapture

  wayland-xdg-activation:
    name: Wayland xdg-activation (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Sway is a tiling Wayland compositor (wlroots-based) that has
      # advertised `xdg_activation_v1` since 1.7. The `weston`
      # ubuntu-latest ships doesn't expose it via the headless
      # backend (either too old or the desktop-shell module is
      # stripped); sway's headless mode via WLR_BACKENDS=headless
      # exposes the full protocol surface including xdg-activation.
      # Catches the class of regression we'd hit if a
      # `wayland-client` version bump or protocol-schema change
      # broke our dispatch loop / token extraction.
      - name: Install Sway
        run: |
          sudo apt-get update
          sudo apt-get install -y sway

      - name: Start Sway (headless) and run xdg_activation test
        run: |
          set -e
          # Sway needs XDG_RUNTIME_DIR with 0700 perms. The
          # systemd-spawned dir on real desktops is /run/user/<uid>;
          # the runner doesn't have one, so create our own.
          export XDG_RUNTIME_DIR=/tmp/wayland-runtime
          mkdir -p $XDG_RUNTIME_DIR
          chmod 700 $XDG_RUNTIME_DIR

          # Minimal sway config — just a virtual output so wlroots
          # has something to render to. No keybindings or workspaces
          # needed; we only use sway for its Wayland protocol surface.
          cat > /tmp/sway-test.conf <<'EOF'
          output HEADLESS-1 mode 1280x800
          EOF

          # WLR_BACKENDS=headless: use the wlroots headless backend
          # (no GPU / framebuffer required).
          # WLR_LIBINPUT_NO_DEVICES=1: don't fail when /dev/input/*
          # devices aren't present on the runner (they aren't unless
          # the integration-linux job already created uinput nodes).
          WLR_BACKENDS=headless WLR_LIBINPUT_NO_DEVICES=1 \
            sway -c /tmp/sway-test.conf >/tmp/sway.log 2>&1 &
          SWAY_PID=$!

          # Wait for sway's Wayland socket to appear. Sway names it
          # `wayland-N`; we pick the first one that shows up.
          WAYLAND_SOCK=""
          for _ in $(seq 1 50); do
            WAYLAND_SOCK=$(ls "$XDG_RUNTIME_DIR" 2>/dev/null \
              | grep -E '^wayland-[0-9]+$' | head -1 || true)
            if [ -n "$WAYLAND_SOCK" ]; then
              break
            fi
            sleep 0.1
          done

          if [ -z "$WAYLAND_SOCK" ]; then
            echo "Sway never bound a Wayland socket. Log:"
            cat /tmp/sway.log
            kill $SWAY_PID 2>/dev/null || true
            exit 1
          fi

          export WAYLAND_DISPLAY=$WAYLAND_SOCK
          echo "Sway running, WAYLAND_DISPLAY=$WAYLAND_DISPLAY"
          cargo test --bin Nicotine xdg_activation -- --ignored --nocapture
          STATUS=$?
          kill $SWAY_PID 2>/dev/null || true
          exit $STATUS
